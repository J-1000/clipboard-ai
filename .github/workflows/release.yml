name: Release

on:
  push:
    tags: ['v*']

# Build jobs only read the repository; the release job raises this itself.
permissions:
  contents: read

jobs:
  build-agent:
    # golang.design/x/clipboard requires cgo on macOS (-framework Foundation
    # -framework Cocoa); with CGO_ENABLED=0 the build links clipboard_nocgo.go
    # whose initialize() panics at startup. Build natively on a macOS runner.
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
            cc: clang
          - goarch: amd64
            cc: clang -arch x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Build agent
        run: go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o clipboard-ai-agent-darwin-${{ matrix.goarch }} ./cmd/clipboard-ai-agent/
        working-directory: agent
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
      # Regression guard for the CGO/crash-loop class: a natively-built binary
      # must boot and stay alive instead of panicking in clipboard.Init().
      - name: Boot smoke test
        if: matrix.goarch == 'arm64'
        run: ./scripts/agent-boot-smoke.sh agent/clipboard-ai-agent-darwin-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: agent-darwin-${{ matrix.goarch }}
          path: agent/clipboard-ai-agent-darwin-${{ matrix.goarch }}

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: cli
      - name: Build CLI
        run: bun build src/index.ts --outdir dist --target node --define "__CBAI_VERSION__=\"${GITHUB_REF_NAME}\""
        working-directory: cli
      - uses: actions/upload-artifact@v7
        with:
          name: cli-dist
          path: cli/dist/

  build-menubar:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
            swiftarch: arm64
          - goarch: amd64
            swiftarch: x86_64
    steps:
      - uses: actions/checkout@v6
      - name: Build native menubar app
        run: swift build -c release --arch ${{ matrix.swiftarch }}
        working-directory: menubar
      - name: Package app bundle
        run: >-
          ./scripts/package-menubar.sh
          menubar/.build/${{ matrix.swiftarch }}-apple-macosx/release/ClipboardAIMenuBar
          menubar/release
          "${GITHUB_REF_NAME}"
          ${{ matrix.goarch }}
      - uses: actions/upload-artifact@v7
        with:
          name: menubar-darwin-${{ matrix.goarch }}
          path: menubar/release/clipboard-ai-menubar-darwin-${{ matrix.goarch }}.zip

  release:
    needs: [build-agent, build-cli, build-menubar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Generate checksums
        # Lets users verify downloaded assets (no codesigning/notarization yet).
        run: |
          shopt -s nullglob
          sha256sum clipboard-ai-agent-* clipboard-ai-menubar-* index.js > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            clipboard-ai-agent-*
            clipboard-ai-menubar-*
            index.js
            SHA256SUMS
