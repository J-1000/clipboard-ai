name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Go agent
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Race test
        run: go test -race ./...
        working-directory: agent
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        working-directory: agent

  cli:
    name: TypeScript CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: cli
      - name: Test
        run: bun test
        working-directory: cli
      - name: Type-check
        run: bun run typecheck
        working-directory: cli
      - name: Build
        run: bun run build
        working-directory: cli

  raycast:
    name: Raycast extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/raycast/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: integrations/raycast
      - name: Lint
        run: npm run lint
        working-directory: integrations/raycast
      - name: Build
        run: npm run build
        working-directory: integrations/raycast
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: integrations/raycast
      - name: Audit all dependencies
        run: npm audit --audit-level=high
        working-directory: integrations/raycast

  menubar:
    name: Native menubar app
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: swift test
        working-directory: menubar
      - name: Build
        run: swift build -c release
        working-directory: menubar
